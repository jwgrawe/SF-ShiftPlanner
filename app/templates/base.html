<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}SF-Planlegger{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>{% block style %}{% endblock %}</style>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block header %}
  <header class="app">
    <span class="brand">SF-Planlegger</span>
    <nav>
      <a href="/">I dag</a>
      <a href="/display">Tavle</a>
      <a href="/plan">Planlegging</a>
      <a href="/admin">Administrasjon</a>
    </nav>
    <span class="muted small" style="margin-left:auto">Prototype (M2)</span>
  </header>
  {% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
