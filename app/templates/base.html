<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}SF-Planlegger{% endblock %}</title>
  <style>
    :root {
      --ground: #f6f8f9; --surface: #ffffff; --ink: #1d2b33; --ink-soft: #5a6b74;
      --line: #d7dfe3; --accent: #1f6e7e;
      --uren: #b0503f; --ren: #3d6fa8; --steril: #4e8a5d; --utpost: #96702e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--ground); color: var(--ink);
      font-family: "Segoe UI", system-ui, Arial, sans-serif; line-height: 1.5;
    }
    a { color: var(--accent); }
    header.app {
      display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
      padding: 0.7rem 1.2rem; background: var(--surface); border-bottom: 1px solid var(--line);
    }
    header.app .brand { font-weight: 700; letter-spacing: 0.02em; }
    header.app nav a { margin-right: 0.9rem; text-decoration: none; }
    main { padding: 1.2rem; max-width: 72rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0.2rem 0 0.8rem; }
    h2 { font-size: 1.1rem; margin: 1.6rem 0 0.5rem; }
    table { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 0.92rem; }
    th, td { text-align: left; padding: 0.4rem 0.7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
    .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin: 0.6rem 0 1rem; }
    .muted { color: var(--ink-soft); }
    .badge {
      display: inline-block; font-size: 0.72rem; font-weight: 600; border-radius: 999px;
      padding: 0.1rem 0.55rem; color: #fff; letter-spacing: 0.03em; white-space: nowrap;
    }
    .badge.uren { background: var(--uren); } .badge.ren { background: var(--ren); }
    .badge.steril { background: var(--steril); } .badge.utpost { background: var(--utpost); }
    .badge.soft { background: var(--line); color: var(--ink-soft); }
    .note {
      background: #fdf6e6; border: 1px solid #ddc38a; border-radius: 8px;
      padding: 0.6rem 0.9rem; margin: 0.8rem 0; font-size: 0.92rem;
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  {% block header %}
  <header class="app">
    <span class="brand">SF-Planlegger</span>
    <nav>
      <a href="/display">Tavle</a>
      <a href="/plan">Plan</a>
      <a href="/admin">Administrasjon</a>
    </nav>
    <span class="muted" style="margin-left:auto; font-size:0.85rem">Prototype (M1) – kun lesing</span>
  </header>
  {% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
